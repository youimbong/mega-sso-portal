name: mega-sso-portal

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      # 호스트 5432는 로컬 PostgreSQL / SSH 터널이 쓰고 있어 5433으로 노출한다.
      # 컨테이너 간 통신(Keycloak → postgres)은 여전히 5432를 쓴다.
      - '5433:5432'
    volumes:
      # PostgreSQL 18+ 공식 이미지는 /var/lib/postgresql 에 마운트해야 한다.
      # (하위 디렉터리를 메이저 버전별로 나눠 pg_upgrade를 지원하는 구조로 바뀌었다)
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    restart: unless-stopped
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      # 컨테이너 내부 이슈어와 브라우저가 보는 이슈어를 일치시킨다. 불일치하면 토큰 검증이 깨진다.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'false'
      # --import-realm은 realm이 이미 있으면 건너뛴다
      # (실측: "Realm 'mega' already exists. Import skipped").
      # 그래서 realm 템플릿을 고쳐도 컨테이너를 다시 만드는 것만으로는 반영되지 않는다.
      # KC_SPI_IMPORT_SINGLE_FILE_STRATEGY로는 못 바꾼다 — 26.7.1에서 이 변수를 컨테이너에
      # 넣어도 무시하고 IGNORE_EXISTING으로 돈다(실측). 재적용은 README의 kc.sh import 절차를
      # 쓴다. 그 경로는 realm을 지우고 다시 만들므로 콘솔/포털에서 만든 계정은 사라진다.
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-mega.json:/opt/keycloak/data/import/realm-mega.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
